[package]
name = "mundusai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mundusai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
notify-debouncer-mini = "0.7"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
lancedb = { version = "0.38.0", features = ["remote"] }
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.23.2"
hf-hub = { version = "0.3.2", features = ["tokio"] }
reqwest = { version = "0.11", features = ["stream", "rustls-tls"] }
pdf-extract = "0.12.0"
text-splitter = "0.32.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }
tauri-plugin-shell = "2.3.6"
futures = "0.3.34"
tauri-plugin-store = "2.4.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
